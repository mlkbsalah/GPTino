[build-system]
requires = ["uv_build>=0.13.6, <0.14.0"]
build-backend = "uv_build"

[project]
name = "gptino"
version = "0.1.0"
description = "LLM learning"
requires-python = ">=3.14"
authors = [
    { name = "mlkbsalah", email = "malek.ben-salah@centralesupelec.fr" }
]
dependencies = [
    "datasets>=5.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyaml>=26.7.0",
    "tiktoken>=0.14.0",
    "torch>=2.11.0",
    "tqdm>=4.70.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cuda-12.8", marker = "sys.platform == 'linux'"}
]

[[tool.uv.index]]
name = "pytorch-cuda-12.8"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
