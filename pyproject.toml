[project]
name = "gptino"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mlkbsalah", email = "malek.ben-salah@centralesupelec.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "lightning>=2.6.6",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
    "wandb>=0.31.0",
]

[project.scripts]
gptino = "gptino:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
